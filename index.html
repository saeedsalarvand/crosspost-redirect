<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrossPost</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
         align-items: center; justify-content: center; background: #f5f5f7; color: #222; }
  .box { text-align: center; padding: 24px; }
  a.btn { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 12px;
          background: #2563eb; color: #fff; text-decoration: none; font-size: 18px; }
</style>
</head>
<body>
<div class="box">
  <p>ورود انجام شد. در حال بازگشت به اپ CrossPost…</p>
  <a class="btn" id="back" href="#">بازگشت به اپ</a>
</div>
<script>
  // Forwards the OAuth result (?code=...&state=...) to the Android app.
  var target = "crosspost://oauth" + window.location.search;
  document.getElementById("back").href = target;
  window.location.href = target;
</script>
</body>
</html>
